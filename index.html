  <script>

    /* Simple Fire Particle Animation */

    const canvas =
      document.getElementById("fireCanvas");

    const ctx =
      canvas.getContext("2d");

    let particles = [];

    function resizeCanvas() {

      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;
    }

    resizeCanvas();

    window.addEventListener(
      "resize",
      resizeCanvas
    );

    function createParticle() {

      particles.push({

        x:
          Math.random() *
          canvas.width,

        y:
          canvas.height + 10,

        size:
          Math.random() * 2 + 1,

        speed:
          Math.random() * 1.5 + .5,

        opacity:
          Math.random() * .5 + .2

      });

    }

    function animateParticles() {

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      if (
        particles.length < 80
      ) {
        createParticle();
      }

      particles.forEach(
        (p, index) => {

          p.y -= p.speed;

          p.opacity -= .002;

          ctx.beginPath();

          ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
          );

          ctx.fillStyle =
            `rgba(250,188,15,${p.opacity})`;

          ctx.fill();

          if (
            p.y < 0 ||
            p.opacity <= 0
          ) {

            particles.splice(
              index,
              1
            );

          }

        }
      );

      requestAnimationFrame(
        animateParticles
      );
    }

    animateParticles();

  </script>
